version: "3.8"

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  mailcatcher-data:
    driver: local

services:
  ec-cube:
    image: ghcr.io/ec-cube/ec-cube-php:8.1-apache
    ports:
      - "8080:80"
      - "4430:443"
    volumes:
      - ./ec-cube:/var/www/html
      - /var/www/html/.git
    environment:
      APP_ENV: "dev"
      APP_DEBUG: 1
      DATABASE_URL: "mysql://dbuser:secret@mysql/eccubedb"
      DATABASE_SERVER_VERSION: 8
      DATABASE_CHARSET: "utf8mb4"
      MAILER_DSN: "smtp://mailcatcher:1025"
      ECCUBE_AUTH_MAGIC: "atomiclink2026ticket"
      ECCUBE_LOCALE: "ja"
      ECCUBE_TIMEZONE: "Asia/Tokyo"
      ECCUBE_CURRENCY: "JPY"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eccubedb
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: secret
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - backend
